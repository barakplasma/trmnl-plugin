name: "Israel Bus"
strategy: "polling"
# One plugin instance per trip (e.g. home -> work, work -> home). Each trip has
# up to two ways to leave (e.g. a bus stop and a light rail stop); blank slots
# are skipped by the server. "to" keeps only lines heading to that stop.
polling_url: "{{ server_url }}/stops?title={{ trip_title | url_encode }}&stop={{ stop_1_code }}&to={{ stop_1_to }}&lines={{ stop_1_lines | url_encode }}&label={{ stop_1_label | url_encode }}&shuttle={{ stop_1_shuttle | url_encode }}&walk={{ stop_1_walk }}&stop={{ stop_2_code }}&to={{ stop_2_to }}&lines={{ stop_2_lines | url_encode }}&label={{ stop_2_label | url_encode }}&shuttle={{ stop_2_shuttle | url_encode }}&walk={{ stop_2_walk }}"
polling_verb: "get"
no_screen_padding: "no"
dark_mode: "no"
# Minutes between polls. Arrival clock times stay correct between refreshes; minutes drift.
refresh_interval: 5
custom_fields:
  - keyname: "server_url"
    name: "Server URL"
    field_type: "url"
    default: "http://israel-bus.israel-bus.svc.cluster.local:8080"
    description: "Where the israel-bus service runs, no trailing slash"
  - keyname: "trip_title"
    name: "Trip title"
    field_type: "string"
    default: "מהבית לעבודה"
    description: "Shown in the title bar, e.g. מהבית לעבודה or מהעבודה הביתה"
  - keyname: "stop_1_code"
    name: "Option 1: board at stop"
    field_type: "string"
    default: ""
    placeholder: "stop code, e.g. 27997"
    description: "The number on the stop sign (makat), digits only"
  - keyname: "stop_1_to"
    name: "Option 1: get off at stop"
    field_type: "string"
    default: ""
    placeholder: "stop code (blank = any direction)"
    description: "Only lines that reach this stop are shown, so the direction is always right"
  - keyname: "stop_1_lines"
    name: "Option 1: lines"
    field_type: "string"
    default: ""
    placeholder: "e.g. 601,606 (blank = all)"
    description: "Comma-separated, matched exactly: 1 is not 1א"
  - keyname: "stop_1_label"
    name: "Option 1: label"
    field_type: "string"
    default: ""
    placeholder: "blank = stop name from the API"
  - keyname: "stop_1_walk"
    name: "Option 1: walk to the stop (minutes)"
    field_type: "number"
    default: "0"
    description: "Lead time. Times shown are when to leave the door: bus time minus this. Buses you can no longer reach are hidden"
  - keyname: "stop_1_shuttle"
    name: "Option 1: shuttle times"
    field_type: "string"
    default: ""
    placeholder: "16:30, 18:00, 20:00"
    description: "Hand-entered departures (no web source), merged with the buses. With no stop code the option shows only these"
  - keyname: "stop_2_code"
    name: "Option 2: board at stop"
    field_type: "string"
    default: ""
    placeholder: "blank to show one option"
  - keyname: "stop_2_to"
    name: "Option 2: get off at stop"
    field_type: "string"
    default: ""
    placeholder: "stop code (blank = any direction)"
  - keyname: "stop_2_lines"
    name: "Option 2: lines"
    field_type: "string"
    default: ""
    placeholder: "e.g. R1 (blank = all)"
  - keyname: "stop_2_label"
    name: "Option 2: label"
    field_type: "string"
    default: ""
    placeholder: "blank = stop name from the API"
  - keyname: "stop_2_walk"
    name: "Option 2: walk to the stop (minutes)"
    field_type: "number"
    default: "0"
    description: "Lead time. Times shown are when to leave the door: bus time minus this. Buses you can no longer reach are hidden"
  - keyname: "stop_2_shuttle"
    name: "Option 2: shuttle times"
    field_type: "string"
    default: ""
    placeholder: "16:30, 18:00, 20:00"
    description: "Hand-entered departures (no web source), merged with the buses. With no stop code the option shows only these"
