name: "Israel Bus"
strategy: "polling"
# One request for both stops; blank slots are skipped by the server.
polling_url: "{{ server_url }}/stops?stop={{ stop_1_code }}&lines={{ stop_1_lines | url_encode }}&label={{ stop_1_label | url_encode }}&stop={{ stop_2_code }}&lines={{ stop_2_lines | url_encode }}&label={{ stop_2_label | url_encode }}"
polling_verb: "get"
no_screen_padding: "no"
dark_mode: "no"
# Minutes between polls. Arrival clock times stay correct between refreshes; "min" drifts.
refresh_interval: 5
custom_fields:
  - keyname: "server_url"
    name: "Server URL"
    field_type: "url"
    default: "http://israel-bus.israel-bus.svc.cluster.local:8080"
    description: "Where the israel-bus service runs, no trailing slash"
  - keyname: "stop_1_label"
    name: "Stop 1 label"
    field_type: "string"
    default: "Home"
  - keyname: "stop_1_code"
    name: "Stop 1 code"
    field_type: "string"
    default: ""
    placeholder: "e.g. 27997"
    description: "The stop number on the sign (makat), digits only"
  - keyname: "stop_1_lines"
    name: "Stop 1 lines"
    field_type: "string"
    default: ""
    placeholder: "e.g. 124,155 (blank = all)"
    description: "Comma-separated, matched exactly: 1 is not 1א"
  - keyname: "stop_2_label"
    name: "Stop 2 label"
    field_type: "string"
    default: "Work"
  - keyname: "stop_2_code"
    name: "Stop 2 code"
    field_type: "string"
    default: ""
    placeholder: "blank to show one stop"
  - keyname: "stop_2_lines"
    name: "Stop 2 lines"
    field_type: "string"
    default: ""
    placeholder: "e.g. 124,155 (blank = all)"
